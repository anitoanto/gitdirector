name: Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  version-gate:
    name: Check Published Version
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.check.outputs.version }}
      should-publish: ${{ steps.check.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare pyproject version against PyPI
        id: check
        run: |
          set -euo pipefail

          version="$(python -c '
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          http_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/gitdirector/$version/json")"

          case "$http_status" in
            404)
              echo "Version $version is not on PyPI - publishing."
              echo "should-publish=true" >> "$GITHUB_OUTPUT"
              ;;
            200)
              echo "Version $version is already on PyPI - skipping publish."
              echo "should-publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected response from PyPI (HTTP $http_status)." >&2
              exit 1
              ;;
          esac

  # The release jobs below deliberately live in this file rather than a
  # reusable workflow. PyPI verifies an upload's PEP 740 attestation against
  # the certificate's Build Config URI, which Fulcio always fills in from the
  # *entrypoint* workflow. Behind a `workflow_call` the publish job signs as
  # the reusable workflow but the certificate still says this file, so PyPI
  # rejects the upload. Keeping publish here makes both match .github/
  # workflows/main.yml, which is what the Trusted Publisher must be set to.
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: version-gate
    if: needs.version-gate.outputs.should-publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/gitdirector/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # Runs only after a successful publish, so a tag exists only for a version
    # that actually reached PyPI -- no orphan tags from a failed build.
    needs: [version-gate, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail

          tag="v${VERSION}"

          # The version gate keys off PyPI, not off tags, so a half-failed run
          # (tag created, publish failed) could leave the tag behind. Treat an
          # existing release as success rather than failing the whole workflow.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to do."
            exit 0
          fi

          # Creates the tag at this exact commit as a side effect, so no tag
          # ever has to be pushed by hand.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            dist/*
