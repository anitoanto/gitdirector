name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run linter
        run: uv run ruff check src/ tests/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      TMUX_VERSION: "3.7c"
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      # GitDirector needs tmux 3.7+ (kill-session -g); the runner ships an older one.
      - name: Cache tmux
        id: tmux-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/tmux
          key: tmux-${{ env.TMUX_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build tmux
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libevent-dev libncurses-dev bison pkg-config
          curl -fsSL "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/tmux-${TMUX_VERSION}.tar.gz" | tar xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-${TMUX_VERSION}"
          ./configure --prefix="$HOME/.local/tmux"
          make -j"$(nproc)"
          make install

      # libevent's runtime comes with the runner's own tmux package.
      - name: Put tmux on PATH
        run: echo "$HOME/.local/tmux/bin" >> "$GITHUB_PATH"

      - name: Show tmux version
        run: tmux -V

      - name: Run tests
        run: uv run pytest